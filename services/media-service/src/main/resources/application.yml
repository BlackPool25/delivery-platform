server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: media-service
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:delivery-media}

media:
  staging-dir: ${MEDIA_STAGING_DIR:/tmp/delivery-media/staging}
  tus:
    max-size-bytes: 1073741824 # 1 GB
  rabbitmq:
    exchange: video.transcode.exchange
    queue: video.transcode.jobs
    routing-key: video.transcode.job

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
