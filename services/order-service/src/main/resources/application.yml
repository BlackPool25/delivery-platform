server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OrderHikariPool
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false
    repair-on-migrate: true
    table: flyway_schema_history_order

outbox:
  partition:
    create-cron: "0 5 0 * * *"
    prune-cron: "0 0 2 * * *"
    retention-days: 7

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8082}

order:
  saga:
    interval-ms: 15000
    payment-timeout-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
