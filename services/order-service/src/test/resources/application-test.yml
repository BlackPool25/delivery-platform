server:
  port: 0

spring:
  application:
    name: order-service-test
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

outbox:
  partition:
    create-cron: "-"
    prune-cron: "-"
    retention-days: 7

logging:
  level:
    org.flywaydb: INFO
    org.hibernate: WARN
    com.delivery.order: DEBUG
