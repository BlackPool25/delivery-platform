server:
  port: 0

spring:
  application:
    name: catalog-service-test
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: INFO
    org.hibernate: WARN
    com.delivery.catalog: DEBUG
