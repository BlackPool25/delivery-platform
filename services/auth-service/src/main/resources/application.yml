server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 2000
      validation-timeout: 1000
      pool-name: AuthHikariPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: false
    repair-on-migrate: true
    table: flyway_schema_history_auth
    locations: classpath:db/migration

auth:
  jwt:
    access-token-validity-seconds: 900 # 15 minutes
    refresh-token-validity-seconds: 604800 # 7 days
  otp:
    validity-seconds: 300 # 5 minutes

sms-gateway:
  url: ${SMS_GATEWAY_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.delivery.auth: INFO
    org.springframework.web: INFO
