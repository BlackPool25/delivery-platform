server:
  port: 0

spring:
  application:
    name: auth-service-test
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

auth:
  jwt:
    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 604800
  otp:
    validity-seconds: 300

sms-gateway:
  url: http://localhost:8083

logging:
  level:
    org.flywaydb: INFO
    org.hibernate: WARN
    com.delivery.auth: DEBUG
