server:
  port: 0

spring:
  application:
    name: tracking-service-test
  threads:
    virtual:
      enabled: true

tracking:
  velocity:
    max-kmh: 120.0
  telemetry:
    ttl-seconds: 3600
    history-limit: 1000
  h3:
    resolution: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info
