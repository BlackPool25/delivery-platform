apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delivery-boundary-ingress
  namespace: delivery
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "ntfy-service"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Idempotency-Key,X-Simulate-Delay-Ms,X-Simulate-Failure"
spec:
  rules:
  - http:
      paths:
      # Local Payment Ledger Service
      - path: /api/v1/payments
        pathType: Prefix
        backend:
          service:
            name: local-payment-service
            port: { number: 8080 }

      # Local Telephony / SMS Mock Gateway API
      - path: /api/v1/sms
        pathType: Prefix
        backend:
          service:
            name: local-sms-gateway
            port: { number: 8080 }

      # Local SMS Web Inbox UI
      - path: /admin/sms-inbox
        pathType: Prefix
        backend:
          service:
            name: local-sms-gateway
            port: { number: 8080 }

      # Local Push Notification Broker (ntfy WebSockets & SSE)
      - path: /push
        pathType: Prefix
        backend:
          service:
            name: ntfy-service
            port: { number: 80 }
