apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: delivery-prod
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: delivery-platform
    app.kubernetes.io/component: database
data:
  postgresql.conf: |
    # PostgreSQL 16 Configuration - Sovereign Delivery Platform
    # Hardened for High-Concurrency CDC, Debezium, PostGIS, and Zero-Loss Local Testing
    listen_addresses = '*'
    max_connections = 200
    shared_buffers = 512MB
    effective_cache_size = 1536MB
    maintenance_work_mem = 128MB
    work_mem = 16MB
    min_wal_size = 1GB
    max_wal_size = 8GB
    checkpoint_completion_target = 0.9
    checkpoint_timeout = 15min
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    wal_level = logical
    max_replication_slots = 10
    max_slot_wal_keep_size = -1
    wal_keep_size = 4GB
    log_destination = 'stderr'
    logging_collector = off
    log_min_messages = warning
    log_line_prefix = '%m [%p] %q%u@%d '

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: delivery-prod
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: delivery-platform
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: delivery_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres_dev_secret

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: delivery-prod
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: delivery-platform
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: delivery-prod
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: delivery-platform
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: delivery-platform
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - "postgres"
            - "-c"
            - "config_file=/etc/postgresql/postgresql.conf"
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: 2000m
              memory: 3072Mi
          volumeMounts:
            - name: postgres-config-volume
              mountPath: /etc/postgresql
              readOnly: true
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-config-volume
          configMap:
            name: postgres-config
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
