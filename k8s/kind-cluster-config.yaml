kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  # Ingress HTTP mapped to available host port 8085
  - containerPort: 80
    hostPort: 8085
    listenAddress: "0.0.0.0"
    protocol: TCP
  # gRPC telemetry mapped to host port 9090
  - containerPort: 9090
    hostPort: 9090
    listenAddress: "0.0.0.0"
    protocol: TCP
