apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: delivery-prod
data:
  db_url: "jdbc:postgresql://postgres.delivery-prod.svc.cluster.local:5432/delivery_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: delivery-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: delivery-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0 # Zero-downtime rolling deploys
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      terminationGracePeriodSeconds: 60 # Allow in-flight Virtual Thread transactions to finish
      
      # Anti-affinity: Spread replicas across different physical nodes and failure zones
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - order-service
                topologyKey: "kubernetes.io/hostname"

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: order-service
          image: ghcr.io/delivery-platform/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081

          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1024Mi"

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "false"
            - name: SPRING_FLYWAY_REPAIR_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_VALIDATE_ON_MIGRATE
              value: "false"
            - name: SPRING_FLYWAY_TABLE
              value: "flyway_schema_history_order"
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.delivery-prod.svc.cluster.local:5432/delivery_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PAYMENT_SERVICE_URL
              value: "http://local-payment-service.delivery-prod.svc.cluster.local:8080"

          # Writable ephemeral volume for JVM temp files
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          # Probes tuned for Spring Boot Actuator
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

          # PreStop Hook: Delay SIGTERM by 15s to allow Kubernetes Endpoints/kube-proxy propagation
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: delivery-prod
  labels:
    app.kubernetes.io/name: order-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: delivery-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 3
  maxReplicas: 25
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: delivery-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
