apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-sms-gateway
  namespace: delivery-prod
  labels:
    app.kubernetes.io/name: local-sms-gateway
    app.kubernetes.io/part-of: delivery-platform
    app.kubernetes.io/component: boundary-mock
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: local-sms-gateway
  template:
    metadata:
      labels:
        app: local-sms-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: local-sms-gateway
        image: delivery/local-sms-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 8080
        resources:
          # Strict Resource Allocation Budget (plan.md Section 4.2)
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xmx24m -Xms16m -XX:MaxMetaspaceSize=72m -XX:ReservedCodeCacheSize=12m -Xss256k"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: local-sms-gateway
  namespace: delivery-prod
  labels:
    app.kubernetes.io/name: local-sms-gateway
    app.kubernetes.io/part-of: delivery-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: local-sms-gateway
