services:
  # ========================================================
  # Single Host Port Ingress Gateway (Port 8080)
  # ========================================================
  ingress-proxy:
    image: nginx:alpine
    container_name: delivery-ingress-phase5
    ports:
      - "${INGRESS_PORT:-8080}:8080"
    volumes:
      - ./ingress-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - digital-twin-ui
      - order-service
      - tracking-service
      - martin-service
      - valhalla-service
      - courier-simulator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  # ========================================================
  # Datastores & Infrastructure Brokers
  # ========================================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: delivery-postgres-phase5
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata_phase5:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../migrations/auth-service/V1__init_auth.sql:/docker-entrypoint-initdb.d/00-init-auth.sql:ro
      - ../migrations/catalog-service/V1__init_catalog.sql:/docker-entrypoint-initdb.d/01-init-catalog.sql:ro
      - ../migrations/catalog-service/V2__seed_demo_restaurants.sql:/docker-entrypoint-initdb.d/01b-seed-catalog.sql:ro
      - ../migrations/order-service/V1__init_orders_and_outbox.sql:/docker-entrypoint-initdb.d/02-init-orders-and-outbox.sql:ro
      - ../migrations/payment-service/V1__init_payment_ledger.sql:/docker-entrypoint-initdb.d/03-init-payment-ledger.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  redis:
    image: redis:7-alpine
    container_name: delivery-redis-phase5
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - delivery-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: delivery-rabbitmq-phase5
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  minio:
    image: minio/minio:latest
    container_name: delivery-minio-phase5
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata_phase5:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: delivery-ntfy-phase5
    command: ["ntfy", "serve"]
    environment:
      NTFY_BASE_URL: "http://localhost:8080/push"
      NTFY_BEHIND_PROXY: "true"
      NTFY_LISTEN_HTTP: ":80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  # ========================================================
  # Maps & Routing Services (Phase 5)
  # ========================================================
  martin-service:
    image: ghcr.io/maplibre/martin:latest
    container_name: delivery-martin-phase5
    command: ["--route-prefix", "/tiles", "/data/tiles/city.pmtiles"]
    volumes:
      - ../data/tiles:/data/tiles:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/tiles/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  valhalla-service:
    build:
      context: ..
      dockerfile: services/valhalla-service/Dockerfile
    container_name: delivery-valhalla-phase5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  # ========================================================
  # Core Microservices
  # ========================================================
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      local-sms-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SMS_GATEWAY_URL: http://local-sms-gateway:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  local-payment-service:
    build:
      context: ..
      dockerfile: services/local-payment-service/Dockerfile
    container_name: local-payment-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  local-sms-gateway:
    build:
      context: ..
      dockerfile: services/local-sms-gateway/Dockerfile
    container_name: local-sms-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    container_name: catalog-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      local-payment-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PAYMENT_SERVICE_URL: http://local-payment-service:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  tracking-service:
    build:
      context: ..
      dockerfile: services/tracking-service/Dockerfile
    container_name: tracking-service
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  media-service:
    build:
      context: ..
      dockerfile: services/media-service/Dockerfile
    container_name: media-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: delivery-media
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  transcode-worker:
    build:
      context: ..
      dockerfile: services/transcode-worker/Dockerfile
    container_name: transcode-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - 44  # video GID
      - 107 # render GID
    environment:
      SPRING_PROFILES_ACTIVE: local
      LIBVA_DRIVER_NAME: radeonsi
      HSA_OVERRIDE_GFX_VERSION: 11.0.0
      VAAPI_DEVICE: /dev/dri/renderD128
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: delivery-media
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  # ========================================================
  # Digital Twin & Frontend (Phase 5)
  # ========================================================
  courier-simulator:
    build:
      context: ..
      dockerfile: services/courier-simulator/Dockerfile
    container_name: courier-simulator
    depends_on:
      order-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      valhalla-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      ORDER_SERVICE_URL: http://order-service:8080
      TRACKING_SERVICE_URL: http://tracking-service:8080
      VALHALLA_SERVICE_URL: http://valhalla-service:8002
      SIMULATOR_TICK_RATE_MS: 3000
      SIMULATOR_SPEED_KMH: 28.0
      SIMULATOR_AUTO_DISPATCH: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  digital-twin-ui:
    build:
      context: ..
      dockerfile: services/digital-twin-ui/Dockerfile
    container_name: digital-twin-ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

volumes:
  pgdata_phase5:
  miniodata_phase5:

networks:
  delivery-network:
    name: delivery-network
    driver: bridge
