server {
    listen 8080;
    server_name localhost;

    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Core Microservices
    location /api/v1/auth {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /.well-known {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
    }

    location /api/v1/catalog {
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
    }

    location /api/v1/orders {
        proxy_pass http://order-service:8080;
        proxy_set_header Host $host;
    }

    location /api/v1/dispatch {
        proxy_pass http://order-service:8080;
        proxy_set_header Host $host;
    }

    location /api/v1/simulator {
        proxy_pass http://courier-simulator:8080;
        proxy_set_header Host $host;
    }

    location /api/v1/tracking {
        proxy_pass http://tracking-service:8080;
        proxy_set_header Host $host;
    }

    # Tracking WebSocket Gateway
    location /ws/tracking {
        proxy_pass http://tracking-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/v1/media {
        proxy_pass http://media-service:8080;
        proxy_set_header Host $host;
    }

    location /api/v1/payments {
        proxy_pass http://local-payment-service:8080;
        proxy_set_header Host $host;
    }

    location /api/v1/sms {
        proxy_pass http://local-sms-gateway:8080;
        proxy_set_header Host $host;
    }

    # ntfy Push Notifications
    location /push {
        proxy_pass http://ntfy:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Martin PMTiles Vector Tile Server
    location /tiles {
        proxy_pass http://martin-service:3000;
        proxy_set_header Host $host;
    }

    # Valhalla OSM Routing Engine
    location /routing {
        proxy_pass http://valhalla-service:8002;
        proxy_set_header Host $host;
    }

    # S3 Media Chunks & Admin Consoles
    location /media-storage {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
    }

    location /admin/sms-inbox {
        proxy_pass http://local-sms-gateway:8080;
        proxy_set_header Host $host;
    }

    location /admin/minio {
        proxy_pass http://minio:9001;
        proxy_set_header Host $host;
    }

    location /admin/rabbitmq {
        proxy_pass http://rabbitmq:15672;
        proxy_set_header Host $host;
    }

    # Digital Twin MapLibre GL Frontend (Default Root)
    location / {
        proxy_pass http://digital-twin-ui:80;
        proxy_set_header Host $host;
    }
}
