services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: delivery-postgres-phase4
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_phase4:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../migrations/auth-service/V1__init_auth.sql:/docker-entrypoint-initdb.d/00-init-auth.sql:ro
      - ../migrations/catalog-service/V1__init_catalog.sql:/docker-entrypoint-initdb.d/01-init-catalog.sql:ro
      - ../migrations/order-service/V1__init_orders_and_outbox.sql:/docker-entrypoint-initdb.d/02-init-orders-and-outbox.sql:ro
      - ../migrations/payment-service/V1__init_payment_ledger.sql:/docker-entrypoint-initdb.d/03-init-payment-ledger.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  redis:
    image: redis:7-alpine
    container_name: delivery-redis-phase4
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - delivery-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: delivery-rabbitmq-phase4
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  minio:
    image: minio/minio:latest
    container_name: delivery-minio-phase4
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_phase4:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      local-sms-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SMS_GATEWAY_URL: http://local-sms-gateway:8080
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  local-payment-service:
    build:
      context: ..
      dockerfile: services/local-payment-service/Dockerfile
    container_name: local-payment-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  local-sms-gateway:
    build:
      context: ..
      dockerfile: services/local-sms-gateway/Dockerfile
    container_name: local-sms-gateway
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: delivery-ntfy
    command: ["ntfy", "serve"]
    environment:
      NTFY_BASE_URL: "http://localhost:8080/push"
      NTFY_BEHIND_PROXY: "true"
      NTFY_LISTEN_HTTP: ":80"
    ports:
      - "8084:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    container_name: catalog-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      local-payment-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PAYMENT_SERVICE_URL: http://local-payment-service:8080
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  tracking-service:
    build:
      context: ..
      dockerfile: services/tracking-service/Dockerfile
    container_name: tracking-service
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8087:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  media-service:
    build:
      context: ..
      dockerfile: services/media-service/Dockerfile
    container_name: media-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: delivery-media
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  transcode-worker:
    build:
      context: ..
      dockerfile: services/transcode-worker/Dockerfile
    container_name: transcode-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - 44  # video GID
      - 107 # render GID
    environment:
      SPRING_PROFILES_ACTIVE: local
      LIBVA_DRIVER_NAME: radeonsi
      HSA_OVERRIDE_GFX_VERSION: 11.0.0
      VAAPI_DEVICE: /dev/dri/renderD128
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: delivery-media
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

volumes:
  pgdata_phase4:
  miniodata_phase4:

networks:
  delivery-network:
    name: delivery-network
    driver: bridge
