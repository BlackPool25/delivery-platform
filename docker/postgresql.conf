# PostgreSQL 16 Configuration - Sovereign Delivery Platform
# Hardened for High-Concurrency CDC, Debezium, PostGIS, and Zero-Loss Local Testing
# Section 5.2 Architecture Specification

# Networking & Connections
listen_addresses = '*'
max_connections = 200

# Memory Budget (Postgres Container Budget: 1536Mi req / 3072Mi limit)
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 16MB
min_wal_size = 1GB
max_wal_size = 8GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Transactional Outbox & CDC Hardening (Section 5.2 & Phase 2 Deliverable 5)
wal_level = logical
max_replication_slots = 10
# Set to -1 to prevent slot invalidation during heavy local testing bursts
max_slot_wal_keep_size = -1
wal_keep_size = 4GB

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_line_prefix = '%m [%p] %q%u@%d '
